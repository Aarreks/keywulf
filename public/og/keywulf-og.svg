<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Keywulf - Type the world">
  <rect width="1200" height="630" fill="#f3efe4"/>
  <!-- double rule masthead lines -->
  <rect x="90" y="96" width="1020" height="3" fill="#14120d"/>
  <rect x="90" y="104" width="1020" height="1.5" fill="#14120d"/>
  <rect x="90" y="520" width="1020" height="1.5" fill="#14120d"/>
  <rect x="90" y="526" width="1020" height="3" fill="#14120d"/>

  <!-- two typewriter keys -->
  <circle cx="180" cy="300" r="72" fill="#14120d"/>
  <circle cx="180" cy="300" r="58" fill="none" stroke="#f3efe4" stroke-width="6"/>
  <text x="180" y="325" text-anchor="middle" font-family="'Courier Prime','Courier New',monospace" font-weight="700" font-size="72" fill="#f3efe4">K</text>
  <circle cx="290" cy="360" r="72" fill="#b3271f"/>
  <circle cx="290" cy="360" r="58" fill="none" stroke="#f3efe4" stroke-width="6"/>
  <text x="290" y="385" text-anchor="middle" font-family="'Courier Prime','Courier New',monospace" font-weight="700" font-size="72" fill="#fbf8f0">W</text>

  <text x="430" y="330" font-family="'Libre Baskerville',Georgia,'Times New Roman',serif" font-weight="700" font-size="104" fill="#14120d">Keywulf</text>
  <text x="434" y="398" font-family="'Courier Prime','Courier New',monospace" font-weight="700" font-size="34" letter-spacing="6" fill="#b3271f">TYPE THE WORLD.</text>
  <text x="434" y="452" font-family="'Libre Baskerville',Georgia,serif" font-style="italic" font-size="26" fill="#6a6558">The day's news, in two minutes of typing.</text>
</svg>
