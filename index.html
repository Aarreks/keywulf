<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c0d11" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)" />

    <title>Keywulf - Daily news typeracing</title>
    <meta name="description" content="A daily typing game built from the world's most important news. One shared briefing. Everyone types the same world." />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Keywulf" />
    <meta property="og:title" content="Keywulf - Daily news typeracing" />
    <meta property="og:description" content="A daily typing game built from the world's most important news." />
    <meta property="og:url" content="https://keywulf.com/" />
    <meta property="og:image" content="https://keywulf.com/og/keywulf-og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Keywulf - Daily news typeracing" />
    <meta name="twitter:description" content="A daily typing game built from the world's most important news." />
    <meta name="twitter:image" content="https://keywulf.com/og/keywulf-og.svg" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Set theme before paint to avoid a flash of the wrong mode. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('keywulf');
          var pref = raw ? (JSON.parse(raw).settings || {}).theme : 'system';
          var dark =
            pref === 'dark' ||
            ((pref === 'system' || !pref) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Keywulf is a typing game and needs JavaScript enabled to play.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
