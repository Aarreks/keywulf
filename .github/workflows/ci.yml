name: CI

# Runs on every push and pull request. Uses the checked-in sample challenge -
# NO Gemini key required. Verifies types, tests, the sample challenge, and the
# production build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate checked-in challenge (sample fixture)
        run: npm run validate:challenge

      - name: Production build
        run: npm run build
