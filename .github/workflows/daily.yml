name: Deploy app

# GitHub deploys code only. Cloudflare prepares daily news independently and
# selects the correct stored briefing at 01:00 UTC by its server clock.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: keywulf-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Preserve the exact live briefing for migration
        id: live
        run: |
          if curl --fail --silent --show-error --retry 3 --max-time 20 \
            "https://keywulf.com/data/today.json?v=$(date +%s)" \
            --output "$RUNNER_TEMP/keywulf-live.json"; then
            cp "$RUNNER_TEMP/keywulf-live.json" public/data/today.json
            echo "preserved=true" >> "$GITHUB_OUTPUT"
          else
            echo "preserved=false" >> "$GITHUB_OUTPUT"
            echo "Live briefing unavailable; deploy code without seeding a fixture."
          fi

      - name: Validate the preserved briefing
        run: npm run validate:challenge
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build the app
        run: npm run build
      - name: Validate the Worker build
        run: npx wrangler deploy --dry-run
      - name: Deploy and verify daily publication
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          KEYWULF_MIGRATE_LIVE: ${{ steps.live.outputs.preserved }}
        run: node scripts/deploy-cloudflare.mjs
