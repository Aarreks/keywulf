name: Daily briefing freshness

on:
  schedule:
    # Early missed-release alert, then a check after the recovery window.
    - cron: '10 1,3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify the public daily briefing
        run: npx tsx scripts/check-freshness.ts
